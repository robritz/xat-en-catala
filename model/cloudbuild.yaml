# The build pipeline of a model's host, shared by the models. A merge to main
# that changes a model's directory under model/ runs it, through that model's
# trigger, which infra/platform creates and which names the model in _MODEL
# and its image in _IMAGE_NAME; it can also be run by hand, as docs/guide.md
# shows. The source is the whole repository.
#
# It builds the service image and pushes it, and does nothing else: deploying
# it is the deploy pipeline's work, infra/service/cloudbuild.yaml, which the
# same merge starts and which waits for the image this pushes.
#
# The image is tagged with model/image-tag.sh, from the model's Dockerfile's
# checksum. When an image is already pushed under that tag, as when a merge
# changed the model's directory but not its Dockerfile, nothing is built.
#
# Each build also pushes the image as "latest", and the next build reads that
# as its cache. While the engine and the weights stay the same, the weights
# layer is then taken from the image before and not made again, so its digest
# does not change and a deploy moves no weights. Without the cache, the builder
# here gives that layer a new digest on every build. The first build has no
# cache to read, which it warns of and carries on.

substitutions:
  _REPOSITORY: model-host
  _IMAGE: ${LOCATION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE_NAME}

steps:
  - id: build and push the service image
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    env:
      - DOCKER_BUILDKIT=1
    args:
      - -c
      - |
        set -euo pipefail
        image="${_IMAGE}:$$(bash model/image-tag.sh ${_MODEL})"
        if docker manifest inspect "$$image" >/dev/null 2>&1; then
          echo "$$image is pushed already, so there is nothing to build."
          exit 0
        fi
        # BUILDKIT_INLINE_CACHE writes into the image what the next build
        # needs to use it as a cache.
        docker build \
          --cache-from "${_IMAGE}:latest" \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          --tag "$$image" \
          --tag "${_IMAGE}:latest" \
          model/${_MODEL}
        docker push --all-tags "${_IMAGE}"

# Pulling ALIA's 43 GB weights image, copying the file into a layer and
# pushing it takes far longer than Salamandra's 6.4 GB. A build that finds the
# layer in the cache still pulls it.
timeout: 7200s

options:
  # ALIA's file is held up to three times over: in the weights image, in the
  # cache image and as the new image's layer. The worker's own files take
  # 63 GB of the disk. Salamandra's builds get the same room, which they do
  # not need, since the pipeline is shared and Cloud Build takes no
  # substitution here.
  diskSizeGb: 300
  # Lets _IMAGE be made from other substitutions.
  dynamicSubstitutions: true
  # A build that runs as its own service account has to say where its logs go.
  logging: CLOUD_LOGGING_ONLY
