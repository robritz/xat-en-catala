# The build pipeline of the model host. A merge to main that changes model/
# runs it, through the trigger infra/platform creates; it can also be run by
# hand, as the README shows. The source is the whole repository.
#
# It builds the service image and pushes it, and does nothing else: deploying
# it is the deploy pipeline's work, infra/service/cloudbuild.yaml, which the
# same merge starts and which waits for the image this pushes.
#
# The image is tagged with model/image-tag.sh, from the Dockerfile's checksum.
# When an image is already pushed under that tag, as when a merge changed
# model/ but not the Dockerfile, nothing is built.
#
# Each build also pushes the image as "latest", and the next build reads that
# as its cache. While the engine and the weights stay the same, the weights
# layer is then taken from the image before and not made again, so its digest
# does not change and a deploy moves no weights. Without the cache, the builder
# here gives that layer a new digest on every build. The first build has no
# cache to read, which it warns of and carries on.

substitutions:
  _REPOSITORY: model-host
  _REGISTRY: ${LOCATION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}

steps:
  - id: build and push the service image
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    env:
      - DOCKER_BUILDKIT=1
    args:
      - -c
      - |
        set -euo pipefail
        image="${_REGISTRY}/service:$$(bash model/image-tag.sh)"
        if docker manifest inspect "$$image" >/dev/null 2>&1; then
          echo "$$image is pushed already, so there is nothing to build."
          exit 0
        fi
        # BUILDKIT_INLINE_CACHE writes into the image what the next build
        # needs to use it as a cache.
        docker build \
          --cache-from "${_REGISTRY}/service:latest" \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          --tag "$$image" \
          --tag "${_REGISTRY}/service:latest" \
          model
        docker push --all-tags "${_REGISTRY}/service"

timeout: 1800s

options:
  # Lets _REGISTRY be made from other substitutions.
  dynamicSubstitutions: true
  # A build that runs as its own service account has to say where its logs go.
  logging: CLOUD_LOGGING_ONLY
