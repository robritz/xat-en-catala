# Every check the repository has, on every pull request to main and every push
# to it: the app's typecheck, lint and tests, both Terraform configurations'
# formatting and tests, and the model host's Dockerfile lint. A failure in any
# one fails the run.
#
# It uses no secrets and reaches nothing in Google Cloud: the Terraform tests
# plan against a mocked provider. So a pull request from a fork runs it as any
# other does.
#
# Actions are pinned by commit, with the release beside it.

name: test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The version the deploy pipeline's scripts run on, node:22-slim.
          node-version: 22
          cache: npm
      - run: npm ci
      # Writes the route types, such as LayoutProps, into .next/, which the
      # typecheck needs and which only next dev or next build makes otherwise.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test -- run

  terraform:
    runs-on: ubuntu-latest
    strategy:
      # One configuration failing does not hide the other's result.
      fail-fast: false
      matrix:
        configuration: [infra/platform, infra/service]
    defaults:
      run:
        working-directory: ${{ matrix.configuration }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          # The version infra/service/cloudbuild.yaml applies with. Change
          # both together.
          terraform_version: 1.16.6
          terraform_wrapper: false
      - run: terraform init -backend=false -input=false
      - run: terraform fmt -check -recursive
      - run: terraform test

  dockerfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # hadolint 2.15.1. Any finding fails the check. A rule switched off in
      # the Dockerfile is named and explained beside it.
      - run: >-
          docker run --rm -i
          hadolint/hadolint:v2.15.1-debian@sha256:9a3944b7fddcb947d1ffd90829ac1a6e5c30479223358f249d8b96c7d0019e27
          hadolint - < model/Dockerfile
